spring.application.name=PokemonApi

# MySQL debe estar encendido en el puerto 3306.
# createDatabaseIfNotExist=true permite crear la base automaticamente.
spring.datasource.url=jdbc:mysql://localhost:3306/pokemon_api_db?serverTimezone=UTC&createDatabaseIfNotExist=true
# Reemplaza estos valores por los de tu instalacion local de MySQL.
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea/actualiza la tabla Pokemon automaticamente.
spring.jpa.hibernate.ddl-auto=update
